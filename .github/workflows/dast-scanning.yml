name: DAST Scan with OWASP ZAP

on:
  workflow_dispatch:  # Только ручной запуск для безопасности

jobs:
  deploy-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      # Шаг 1: Получение кода Zabbix Docker
      - name: Checkout zabbix-docker repository
        uses: actions/checkout@v4
        with:
          repository: zabbix/zabbix-docker
          ref: latest
      
      # Шаг 2: Запуск Zabbix в Docker
      - name: Start Zabbix stack
        run: |
          # Простой docker-compose для тестирования
          cat > docker-compose.test.yml << 'EOF'
          version: '3.5'
          services:
            mysql-server:
              image: mysql:8.0
              environment:
                MYSQL_DATABASE: zabbix
                MYSQL_USER: zabbix
                MYSQL_PASSWORD: zabbix
                MYSQL_ROOT_PASSWORD: zabbix
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                timeout: 5s
                retries: 10

            zabbix-server:
              image: zabbix/zabbix-server-mysql:6.4-latest
              ports:
                - "10051:10051"
              environment:
                DB_SERVER_HOST: mysql-server
                MYSQL_USER: zabbix
                MYSQL_PASSWORD: zabbix
                MYSQL_DATABASE: zabbix
              depends_on:
                mysql-server:
                  condition: service_healthy

            zabbix-web:
              image: zabbix/zabbix-web-nginx-mysql:6.4-latest
              ports:
                - "8080:8080"
              environment:
                ZBX_SERVER_HOST: zabbix-server
                DB_SERVER_HOST: mysql-server
                MYSQL_USER: zabbix
                MYSQL_PASSWORD: zabbix
                MYSQL_DATABASE: zabbix
              depends_on:
                - mysql-server
                - zabbix-server
          EOF
          
          # Запуск контейнеров
          docker-compose -f docker-compose.test.yml up -d
          
          # Ожидание готовности веб-интерфейса
          echo "Waiting for Zabbix to start..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080 > /dev/null; then
              echo "Zabbix is ready!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
      
      # Шаг 3: Запуск OWASP ZAP Full Scan
      - name: Run OWASP ZAP Full Scan
        run: |
          # Запуск полного сканирования ZAP с дефолтным HTML отчетом
          docker run --network host --rm \
            -v $(pwd):/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:8080 \
            -r zap-report.html \
            -w zap-report.md \
            -m 30 \
            -a
          
          # Проверка наличия отчета
          if [ -f "zap-report.html" ]; then
            echo "ZAP report generated successfully"
            ls -la zap-report.*
          else
            echo "Warning: ZAP report not found"
          fi
        continue-on-error: true  # Продолжить даже при найденных уязвимостях
      
      # Шаг 4: Загрузка отчета как артефакта
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-report.html
            zap-report.md
      
      # Шаг 5: Очистка контейнеров
      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
