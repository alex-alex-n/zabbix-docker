name: DAST Scan with OWASP ZAP

on:
  workflow_dispatch:

jobs:
  deploy-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      # Шаг 1: Получение кода Zabbix Docker (исправленная версия)
      - name: Checkout zabbix-docker repository
        uses: actions/checkout@v4
        with:
          repository: zabbix/zabbix-docker
          # Используем существующую ветку
          ref: main  # или 'master', в зависимости от репозитория
      
      # Шаг 2: Запуск Zabbix в Docker (простая версия)
      - name: Start Zabbix stack
        run: |
          # Создаем простую конфигурацию для тестирования
          echo "Creating test Zabbix environment..."
          
          # Используем docker run вместо docker-compose для простоты
          # Запускаем MySQL
          docker run -d --name zabbix-mysql-test \
            -e MYSQL_DATABASE=zabbix \
            -e MYSQL_USER=zabbix \
            -e MYSQL_PASSWORD=zabbix \
            -e MYSQL_ROOT_PASSWORD=zabbix \
            mysql:8.0 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_bin
          
          sleep 10
          
          # Запускаем Zabbix server
          docker run -d --name zabbix-server-test \
            --link zabbix-mysql-test:mysql \
            -e DB_SERVER_HOST=zabbix-mysql-test \
            -e MYSQL_USER=zabbix \
            -e MYSQL_PASSWORD=zabbix \
            -e MYSQL_DATABASE=zabbix \
            -p 10051:10051 \
            zabbix/zabbix-server-mysql:latest
          
          sleep 10
          
          # Запускаем Zabbix web
          docker run -d --name zabbix-web-test \
            --link zabbix-mysql-test:mysql \
            --link zabbix-server-test:zabbix-server \
            -e ZBX_SERVER_HOST=zabbix-server-test \
            -e DB_SERVER_HOST=zabbix-mysql-test \
            -e MYSQL_USER=zabbix \
            -e MYSQL_PASSWORD=zabbix \
            -e MYSQL_DATABASE=zabbix \
            -p 8080:8080 \
            zabbix/zabbix-web-nginx-mysql:latest
          
          # Ждем запуска сервисов
          echo "Waiting for Zabbix to start (60 seconds)..."
          sleep 60
          
          # Проверяем доступность
          if curl -s -f http://localhost:8080 > /dev/null; then
            echo "✓ Zabbix is ready at http://localhost:8080"
          else
            echo "⚠ Zabbix might not be fully ready, but continuing with scan..."
          fi
      
      # Шаг 3: Запуск OWASP ZAP Full Scan
      - name: Run OWASP ZAP Full Scan
        run: |
          echo "Starting OWASP ZAP Full Scan..."
          echo "Target: http://localhost:8080"
          echo "This will take approximately 30 minutes..."
          
          # Запускаем ZAP сканирование
          docker run --network host --rm \
            -v $(pwd):/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:8080 \
            -r zap-report.html \
            -w zap-report.md \
            -m 30 \
            -a \
            -I
          
          # Проверяем результат
          if [ -f "zap-report.html" ]; then
            echo "✅ ZAP report generated: zap-report.html"
            echo "Report size: $(wc -l < zap-report.html) lines"
          else
            echo "❌ ZAP report not generated"
            exit 1
          fi
      
      # Шаг 4: Загрузка отчета как артефакта
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-report.html
            zap-report.md
      
      # Шаг 5: Очистка контейнеров
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up Docker containers..."
          docker stop zabbix-web-test zabbix-server-test zabbix-mysql-test 2>/dev/null || true
          docker rm zabbix-web-test zabbix-server-test zabbix-mysql-test 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "Cleanup completed"
