# Название workflow, которое будет отображаться в GitHub Actions
name: DAST - OWASP ZAP (Zabbix Docker)

# Блок, описывающий, при каких событиях будет запускаться данный workflow
on:
  # Ручной запуск workflow из интерфейса GitHub (Actions → Run workflow)
  workflow_dispatch:
  # Запуск при создании/обновлении pull request в ветки master или main
  pull_request:
    branches: [ master, main ]
  # Запуск при push в указанные ветки репозитория
  push:
    branches: [ master, main, develop ]
  # Периодический запуск по расписанию (cron)
  schedule:
    # Каждое воскресенье в 02:00 по UTC
    - cron: "0 2 * * 0"

# Настройка прав доступа для GITHUB_TOKEN, который используется в workflow
permissions:
  # Разрешаем только чтение содержимого репозитория
  contents: read

# Описание набора заданий (jobs), выполняемых в рамках workflow
jobs:
  # Имя job, в котором будет выполняться DAST-сканирование OWASP ZAP
  dast-zap:
    # Указываем, что job выполняется на виртуальной машине с Ubuntu
    runs-on: ubuntu-latest
    # Максимальное время работы job — 40 минут, после чего она будет принудительно остановлена
    timeout-minutes: 40

    # Последовательность шагов, которые будут выполнены внутри job
    steps:
      # Шаг: получение (checkout) кода репозитория в рабочую директорию runner’а
      - name: Checkout
        # Используем официальный экшен GitHub для клонирования репозитория
        uses: actions/checkout@v4

      # Шаг: выбор файла docker compose, который будет использоваться для поднятия Zabbix
      - name: Select compose file
        # Присваиваем шагу идентификатор, чтобы далее обращаться к его outputs
        id: compose
        # Указываем, что команды нужно выполнять в оболочке bash
        shell: bash
        # Непосредственно исполняемый скрипт выбора файла compose
        run: |
          # Прерывать выполнение скрипта при любой ошибке команды (set -e)
          set -e
          # Проверяем, существует ли файл compose.yaml в корне репозитория
          if [ -f "compose.yaml" ]; then
            # Если файл найден, записываем имя файла в выходной параметр шага (GITHUB_OUTPUT)
            echo "file=compose.yaml" >> "$GITHUB_OUTPUT"
            # Завершаем скрипт с успешным кодом выхода
            exit 0
          fi

          # Если compose.yaml не найден, пытаемся найти файл по шаблону docker-compose_v3_*latest*.yaml
          f=$(ls -1 docker-compose_v3_*latest*.yaml 2>/dev/null | head -n 1 || true)
          # Проверяем, что переменная f не пуста (то есть файл найден)
          if [ -n "$f" ]; then
            # Сохраняем найденное имя файла как выходной параметр шага
            echo "file=$f" >> "$GITHUB_OUTPUT"
            # Завершаем скрипт с успешным кодом выхода
            exit 0
          fi

          # Если ни один из файлов не найден, выводим диагностическое сообщение
          echo "No compose file found"
          # Печатаем список файлов в текущей директории для отладки
          ls -la
          # Завершаем скрипт с ошибкой, чтобы прервать дальнейшие шаги
          exit 1

      # Шаг: запуск docker-compose стека с Zabbix
      - name: Start Zabbix stack
        # Выполнение команд в оболочке bash
        shell: bash
        run: |
          # Вывод версии установленного Docker для отладки
          docker --version
          # Вывод версии Docker Compose (встроенного в docker CLI)
          docker compose version
          # Запуск docker compose в фоновом режиме (-d) с использованием выбранного ранее файла
          docker compose -f "${{ steps.compose.outputs.file }}" up -d
          # Вывод списка запущенных контейнеров для проверки, что стек поднялся
          docker ps

      # Шаг: ожидание готовности веб-интерфейса Zabbix перед запуском сканирования
      - name: Wait for Zabbix web UI
        # Выполнение команд в оболочке bash
        shell: bash
        run: |
          # Прерывать выполнение скрипта при любой ошибке (кроме тех, которые явно обработаны)
          set -e
          # Базовый URL веб-интерфейса Zabbix (ожидается, что он будет доступен на localhost)
          URL="http://localhost/"
          # Цикл ожидания готовности сервиса: максимум 90 попыток
          for i in {1..90}; do
            # Посылаем HTTP-запрос к указанному URL и получаем только HTTP-код ответа
            # Параметр -s — тихий режим, -o /dev/null — не выводить тело,
            # -w "%{http_code}" — вывести только код ответа
            # '|| true' предотвращает прерывание скрипта в случае ошибки curl
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            # Проверяем, что код ответа 200 (OK) или 302 (Redirect), что обычно означает доступность UI
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              # Сообщаем, что UI Zabbix поднялся и доступен
              echo "Zabbix UI is up: $code"
              # Завершаем скрипт с успешным кодом
              exit 0
            fi
            # Если сервис ещё не готов, ждём 5 секунд и повторяем попытку
            sleep 5
          done
          # Если после всех попыток UI так и не стал доступным, выводим сообщение об ошибке
          echo "Zabbix UI did not become ready in time"
          # Для отладки выводим список текущих контейнеров
          docker ps
          # Для диагностики выводим последние 200 строк логов docker compose (без цветовых кодов)
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color | tail -200
          # Завершаем шаг с ошибкой, чтобы зафейлить job и показать проблему
          exit 1

      # Шаг: подготовка директории для вывода отчётов OWASP ZAP
      - name: Prepare output directory
        # Выполнение команд в оболочке bash
        shell: bash
        run: |
          # Создаём директорию 'zap' (если её нет), куда будут сохраняться результаты сканирования
          mkdir -p zap
          # Устанавливаем максимально широкие права на каталог zap,
          # чтобы контейнер OWASP ZAP мог свободно записывать отчёты в смонтированный каталог
          sudo chmod -R a+rwx zap

      # Шаг: запуск базового сканирования OWASP ZAP в Docker-контейнере
      - name: Run OWASP ZAP baseline (docker)
        # Выполнение команд в оболочке bash
        shell: bash
        run: |
          # Предварительно скачиваем (pull) стабильный образ OWASP ZAP из GitHub Container Registry
          docker pull ghcr.io/zaproxy/zaproxy:stable -q

          # Запуск контейнера OWASP ZAP с использованием baseline-скрипта zap-baseline.py
          # Параметры формирования отчётов:
          # -J — отчёт в формате JSON
          # -w — отчёт в формате Markdown
          # -r — отчёт в формате HTML
          docker run --rm \
            # Используем сеть хоста, чтобы контейнер мог обращаться к Zabbix по адресу localhost
            --network=host \
            # Монтируем локальную директорию zap в директорию /zap/wrk внутри контейнера (чтение/запись)
            -v "${GITHUB_WORKSPACE}/zap:/zap/wrk:rw" \
            # Включаем псевдотерминал (-t), используем стабильный образ ZAP
            -t ghcr.io/zaproxy/zaproxy:stable \
            # Запускаем встроенный скрипт zap-baseline.py для базового DAST-сканирования
            zap-baseline.py \
              # Целевой URL для сканирования — веб-интерфейс Zabbix на localhost
              -t "http://localhost/" \
              # Имя файла JSON-отчёта (будет сохранён в смонтированную директорию /zap/wrk)
              -J "report_json.json" \
              # Имя файла Markdown-отчёта
              -w "report_md.md" \
              # Имя файла HTML-отчёта
              -r "report_html.html" \
              # Флаг -I: игнорировать предупреждения (WARN) и не падать по ним
              -I

          # Примечание:
          # -I = не падать по WARN (удобно для ВКР/первого прогона),
          # т.е. job не будет считаться проваленной, если найдены только предупреждения.
          # Если в дальнейшем необходимо, чтобы pipeline падал при наличии WARN,
          # можно убрать флаг -I, тогда ZAP будет возвращать ненулевой код при таких находках.

      # Шаг: сбор логов docker для последующего анализа, выполняется всегда, даже при ошибках
      - name: Collect docker logs
        # Условие выполнения: always() — шаг выполняется независимо от статуса предыдущих шагов
        if: always()
        # Выполнение команд в оболочке bash
        shell: bash
        run: |
          # Создаём директорию artifacts для сохранения логов и вспомогательных файлов
          mkdir -p artifacts
          # Сохраняем вывод команды docker ps (список контейнеров) в текстовый файл
          docker ps > artifacts/docker-ps.txt
          # Сохраняем логи docker compose в файл, убирая цветовые коды (--no-color)
          # '|| true' позволяет не прерывать шаг, даже если команда завершится с ошибкой
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color > artifacts/docker-compose.log || true

      # Шаг: загрузка (upload) артефактов сканирования и логов в GitHub Actions
      - name: Upload artifacts
        # Условие выполнения: всегда выполняется, даже если предыдущие шаги завершились с ошибкой
        if: always()
        # Используем официальный экшен для загрузки артефактов
        uses: actions/upload-artifact@v4
        with:
          # Имя набора артефактов, под которым он будет отображаться в интерфейсе GitHub Actions
          name: zap-scan-results
          # Список файлов и директорий, которые нужно загрузить как артефакты
          path: |
            # HTML-отчёт OWASP ZAP
            zap/report_html.html
            # JSON-отчёт OWASP ZAP
            zap/report_json.json
            # Markdown-отчёт OWASP ZAP
            zap/report_md.md
            # Список запущенных контейнеров во время сканирования
            artifacts/docker-ps.txt
            # Логи docker compose для диагностики проблем с поднятием стека
            artifacts/docker-compose.log

      # Шаг: остановка и удаление docker-compose стека после завершения сканирования
      - name: Shutdown stack
        # Условие выполнения: всегда выполняется, чтобы гарантированно освободить ресурсы
        if: always()
        # Выполнение команд в оболочке bash
        shell: bash
        run: |
          # Останавливаем и удаляем контейнеры, а также связанные с ними тома (-v)
          # '|| true' предотвращает провал шага, если стек уже остановлен или возникла другая ошибка
          docker compose -f "${{ steps.compose.outputs.file }}" down -v || true
