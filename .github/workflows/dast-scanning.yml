name: DAST - OWASP ZAP (Zabbix Docker)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main, develop ]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  dast-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compose file
        id: compose
        shell: bash
        run: |
          set -e
          if [ -f "compose.yaml" ]; then
            echo "file=compose.yaml" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          f=$(ls -1 docker-compose_v3_*latest*.yaml 2>/dev/null | head -n 1 || true)
          if [ -n "$f" ]; then
            echo "file=$f" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No compose file found"
          ls -la
          exit 1

      - name: Start Zabbix stack
        shell: bash
        run: |
          docker --version
          docker compose version
          docker compose -f "${{ steps.compose.outputs.file }}" up -d
          docker ps

      - name: Wait for Zabbix web UI
        shell: bash
        run: |
          set -e
          URL="http://localhost/"
          for i in {1..90}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color | tail -200
          exit 1

      # Починка прав, чтобы контейнер ZAP мог писать в /zap/wrk (смонтированная папка репозитория)
      - name: Fix workspace permissions for ZAP container
        shell: bash
        run: |
          sudo chmod -R a+rwx "${GITHUB_WORKSPACE}"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost/"
          report_html: "zap-baseline-report.html"
          report_json: "zap-baseline-report.json"
          report_md: "zap-baseline-report.md"
          fail_action: false

          # ключевое: не пытаться создавать GitHub Issues
          allow_issue_writing: false

          # ключевое: имя артефакта без underscore (иначе у вас падает на zap_scan)
          artifact_name: "zap-scan"

          # если поддерживается этой версией — отключит встроенную загрузку артефактов
          upload_artifacts: false

      - name: Collect docker logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          docker ps > artifacts/docker-ps.txt
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color > artifacts/docker-compose.log || true

      # Загружаем отчёты и логи САМИ, нормальным способом
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results
          path: |
            zap-baseline-report.html
            zap-baseline-report.json
            zap-baseline-report.md
            artifacts/docker-ps.txt
            artifacts/docker-compose.log

      - name: Shutdown stack
        if: always()
        shell: bash
        run: |
          docker compose -f "${{ steps.compose.outputs.file }}" down -v || true
