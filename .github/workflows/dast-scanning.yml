name: DAST - OWASP ZAP (Zabbix Docker)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: "0 2 * * 0"  # еженедельно

permissions:
  contents: read

jobs:
  dast-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compose file
        id: compose
        shell: bash
        run: |
          set -e

          # 1) приоритет: compose.yaml (в репозитории он есть и указывает на нужный файл)
          if [ -f "compose.yaml" ]; then
            echo "file=compose.yaml" >> "$GITHUB_OUTPUT"
            echo "Selected compose: compose.yaml"
            exit 0
          fi

          # 2) запасной вариант: любой latest compose
          f=$(ls -1 docker-compose_v3_*latest*.yaml 2>/dev/null | head -n 1 || true)
          if [ -n "$f" ]; then
            echo "file=$f" >> "$GITHUB_OUTPUT"
            echo "Selected compose: $f"
            exit 0
          fi

          echo "No compose file found"
          ls -la
          exit 1

      - name: Start Zabbix stack (docker compose)
        run: |
          docker --version
          docker compose version

          docker compose -f "${{ steps.compose.outputs.file }}" up -d

          docker ps

      - name: Wait for Zabbix web UI
        shell: bash
        run: |
          set -e

          # В большинстве compose в zabbix-docker фронтенд публикуется на 80 порту.
          # Если у вас другой порт — измените URL.
          URL="http://localhost/"

          echo "Waiting for $URL ..."
          for i in {1..90}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)

            # 200 OK или 302 Redirect (например на /zabbix или страницу логина) — считаем, что веб поднялся
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "Web UI is up (HTTP $code)"
              exit 0
            fi

            sleep 5
          done

          echo "Zabbix UI did not become ready in time"
          docker ps
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color | tail -200
          exit 1

      # Пассивный DAST (baseline): безопасно для CI
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost/"
          report_html: "zap-baseline-report.html"
          report_json: "zap-baseline-report.json"
          fail_action: false

      - name: Collect docker logs
        if: always()
        run: |
          mkdir -p artifacts
          docker ps > artifacts/docker-ps.txt
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color > artifacts/docker-compose.log || true

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-results
          path: |
            zap-baseline-report.html
            zap-baseline-report.json
            artifacts/docker-ps.txt
            artifacts/docker-compose.log

      - name: Shutdown stack
        if: always()
        run: |
          docker compose -f "${{ steps.compose.outputs.file }}" down -v || true
