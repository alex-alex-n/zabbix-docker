name: DAST with OWASP ZAP Full Scan

on:
  workflow_dispatch:  # Ручной запуск

jobs:
  deploy-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zabbix-docker
        uses: actions/checkout@v4
        with:
          repository: zabbix/zabbix-docker
          
      - name: Deploy Zabbix with Docker Compose
        run: |
          # Используем docker-compose из репозитория, но упростим до только веб-интерфейса и БД
          # Создаем упрощенный docker-compose для тестирования
          cat > docker-compose.test.yml << 'EOF'
          version: '3.5'
          services:
            zabbix-mysql:
              image: mysql:8.0
              environment:
                MYSQL_DATABASE: zabbix
                MYSQL_USER: zabbix
                MYSQL_PASSWORD: zabbix
                MYSQL_ROOT_PASSWORD: rootpassword
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                timeout: 5s
                retries: 10

            zabbix-server:
              image: zabbix/zabbix-server-mysql:latest
              ports:
                - "10051:10051"
              environment:
                DB_SERVER_HOST: zabbix-mysql
                MYSQL_USER: zabbix
                MYSQL_PASSWORD: zabbix
                MYSQL_DATABASE: zabbix
              depends_on:
                zabbix-mysql:
                  condition: service_healthy

            zabbix-web:
              image: zabbix/zabbix-web-nginx-mysql:latest
              ports:
                - "8080:8080"
              environment:
                ZBX_SERVER_HOST: zabbix-server
                DB_SERVER_HOST: zabbix-mysql
                MYSQL_USER: zabbix
                MYSQL_PASSWORD: zabbix
                MYSQL_DATABASE: zabbix
              depends_on:
                - zabbix-mysql
                - zabbix-server
          EOF
          
          docker-compose -f docker-compose.test.yml up -d
          
          # Ждем, пока веб-интерфейс станет доступен
          timeout 300 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 5; done'
          
      - name: Run OWASP ZAP Full Scan
        run: |
          # Запускаем ZAP full scan в контейнере, передавая URL Zabbix
          docker run --network host -v $(pwd):/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:8080 \
            -g gen.conf -r zap-report.html \
            -d -m 30
          
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
          
      - name: Cleanup
        run: |
          docker-compose -f docker-compose.test.yml down
