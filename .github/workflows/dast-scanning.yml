# Название рабочего процесса
name: DAST - OWASP ZAP (Zabbix Docker)

# Триггеры запуска
on:
  # Ручной запуск через интерфейс GitHub
  workflow_dispatch:
  # Запуск при создании пул-реквеста в указанные ветки
  pull_request:
    branches: [ master, main ]
  # Запуск при пуше в указанные ветки
  push:
    branches: [ master, main, develop ]
  # Запуск по расписанию: каждое воскресенье в 2:00
  schedule:
    - cron: "0 2 * * 0"

# Права доступа для GitHub токена
permissions:
  contents: read

# Определение заданий
jobs:
  # Задание для динамического анализа безопасности (DAST)
  dast-zap:
    # Запуск на последней версии Ubuntu
    runs-on: ubuntu-latest
    # Таймаут выполнения задания (40 минут)
    timeout-minutes: 40

    # Шаги выполнения задания
    steps:
      # Шаг 1: Получение кода из репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # Шаг 2: Выбор файла docker-compose
      - name: Select compose file
        # Идентификатор для использования в других шагах
        id: compose
        # Используем bash shell
        shell: bash
        # Команды для выполнения
        run: |
          # Выход при ошибке
          set -e
          # Проверяем наличие compose.yaml
          if [ -f "compose.yaml" ]; then
            # Сохраняем имя файла в переменную вывода
            echo "file=compose.yaml" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ищем файлы docker-compose_v3_*latest*.yaml
          f=$(ls -1 docker-compose_v3_*latest*.yaml 2>/dev/null | head -n 1 || true)
          # Если файл найден
          if [ -n "$f" ]; then
            # Сохраняем имя файла в переменную вывода
            echo "file=$f" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Если файл не найден
          echo "No compose file found"
          # Показываем содержимое директории
          ls -la
          exit 1

      # Шаг 3: Запуск стека Zabbix
      - name: Start Zabbix stack
        shell: bash
        run: |
          # Проверяем версии Docker и Docker Compose
          docker --version
          docker compose version
          # Запускаем контейнеры в фоновом режиме
          docker compose -f "${{ steps.compose.outputs.file }}" up -d
          # Показываем список запущенных контейнеров
          docker ps

      # Шаг 4: Ожидание доступности веб-интерфейса Zabbix
      - name: Wait for Zabbix web UI
        shell: bash
        run: |
          # Выход при ошибке
          set -e
          # URL для проверки
          URL="http://localhost/"
          # Цикл проверки (90 попыток * 5 секунд = 7.5 минут)
          for i in {1..90}; do
            # Получаем HTTP код ответа
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            # Если сервер отвечает 200 OK или 302 Found
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              # Выводим сообщение об успехе
              echo "Zabbix UI is up: $code"
              exit 0
            fi
            # Ждем 5 секунд перед следующей попыткой
            sleep 5
          done
          # Если сервер не стал доступен
          echo "Zabbix UI did not become ready in time"
          # Показываем информацию о контейнерах
          docker ps
          # Показываем логи последних 200 строк
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color | tail -200
          exit 1

      # Шаг 5: Подготовка директории для результатов
      - name: Prepare output directory
        shell: bash
        run: |
          # Создаем директорию zap
          mkdir -p zap
          # Даем права на запись всем пользователям
          sudo chmod -R a+rwx zap

      # Шаг 6: Запуск OWASP ZAP baseline сканирования
      - name: Run OWASP ZAP baseline (docker)
        shell: bash
        run: |
          # Скачиваем образ ZAP
          docker pull ghcr.io/zaproxy/zaproxy:stable -q
          # Запускаем ZAP baseline сканирование
          docker run --rm \
            # Используем сеть хоста
            --network=host \
            # Монтируем директорию для отчетов
            -v "${GITHUB_WORKSPACE}/zap:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              # Целевой URL
              -t "http://localhost/" \
              # JSON отчет
              -J "report_json.json" \
              # Markdown отчет
              -w "report_md.md" \
              # HTML отчет
              -r "report_html.html" \
              # Игнорировать предупреждения (не падать по ним)
              -I

      # Шаг 7: Сбор логов Docker (всегда, даже при ошибках)
      - name: Collect docker logs
        # Выполнять всегда, даже если предыдущие шаги завершились с ошибкой
        if: always()
        shell: bash
        run: |
          # Создаем директорию для артефактов
          mkdir -p artifacts
          # Сохраняем список процессов Docker
          docker ps > artifacts/docker-ps.txt
          # Сохраняем логи Docker Compose
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color > artifacts/docker-compose.log || true

      # Шаг 8: Загрузка артефактов
      - name: Upload artifacts
        if: always()
        # Используем действие для загрузки артефактов
        uses: actions/upload-artifact@v4
        with:
          # Имя артефакта
          name: zap-scan-results
          # Файлы для загрузки
          path: |
            zap/report_html.html
            zap/report_json.json
            zap/report_md.md
            artifacts/docker-ps.txt
            artifacts/docker-compose.log

      # Шаг 9: Остановка стека Zabbix
      - name: Shutdown stack
        if: always()
        shell: bash
        run: |
          # Останавливаем и удаляем контейнеры с томами
          docker compose -f "${{ steps.compose.outputs.file }}" down -v || true
