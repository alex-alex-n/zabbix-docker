name: DAST - OWASP ZAP (Zabbix Docker)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main, develop ]
  schedule:
    - cron: "0 2 * * 0" # еженедельно

permissions:
  contents: read
  # Важно: issues:write НЕ даём, чтобы action не пыталась создавать Issue.
  # Это устраняет ошибку "Resource not accessible by integration".

jobs:
  dast-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compose file
        id: compose
        shell: bash
        run: |
          set -e

          # В репозитории есть compose.yaml (symlink на docker-compose_v3_*.yaml)
          if [ -f "compose.yaml" ]; then
            echo "file=compose.yaml" >> "$GITHUB_OUTPUT"
            echo "Selected compose: compose.yaml"
            exit 0
          fi

          # Запасной вариант: любой compose latest
          f=$(ls -1 docker-compose_v3_*latest*.yaml 2>/dev/null | head -n 1 || true)
          if [ -n "$f" ]; then
            echo "file=$f" >> "$GITHUB_OUTPUT"
            echo "Selected compose: $f"
            exit 0
          fi

          echo "No compose file found"
          ls -la
          exit 1

      - name: Start Zabbix stack (docker compose)
        shell: bash
        run: |
          docker --version
          docker compose version

          docker compose -f "${{ steps.compose.outputs.file }}" up -d
          docker ps

      - name: Wait for Zabbix web UI
        shell: bash
        run: |
          set -e

          # Обычно web UI доступен на 80 порту.
          # Если в вашем compose проброшен другой порт (например 8080) — поменяйте URL.
          URL="http://localhost/"

          echo "Waiting for $URL ..."
          for i in {1..90}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "Web UI is up (HTTP $code)"
              exit 0
            fi
            sleep 5
          done

          echo "Zabbix UI did not become ready in time"
          docker ps
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color | tail -200
          exit 1

      - name: OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost/"
          report_html: "zap-baseline-report.html"
          report_json: "zap-baseline-report.json"

          # Не валим пайплайн (удобно для ВКР/первичного внедрения)
          fail_action: false

          # Ключевое исправление: запретить попытки создавать Issue/комментарии
          allow_issue_writing: false

      - name: Collect docker logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          docker ps > artifacts/docker-ps.txt
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color > artifacts/docker-compose.log || true

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-results
          path: |
            zap-baseline-report.html
            zap-baseline-report.json
            artifacts/docker-ps.txt
            artifacts/docker-compose.log

      - name: Shutdown stack
        if: always()
        shell: bash
        run: |
          docker compose -f "${{ steps.compose.outputs.file }}" down -v || true
