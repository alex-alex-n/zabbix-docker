# Название рабочего процесса
name: SAST Security Scan # Имя рабочего процесса GitHub Actions

# Триггеры запуска
on: # Секция определения событий запуска workflow
  # При пуше в указанные ветки
  push: # Событие push в репозиторий
    branches: [ master, main, develop ] # Ветки, на которые должен быть пуш
  # При создании пул-реквеста в указанные ветки
  pull_request: # Событие создания pull request
    branches: [ master, main ] # Ветки, в которые создаются PR
  # По расписанию: каждое воскресенье в 00:00
  schedule: # Событие по расписанию (cron)
    - cron: '0 0 * * 0' # Cron выражение (воскресенье в 00:00)

# Права доступа для токена GitHub
permissions: # Настройка разрешений для GitHub токена
  contents: read # Разрешение на чтение содержимого репозитория

# Определение заданий (jobs)
jobs: # Секция определения заданий (jobs)
  # Задание для анализа PHP кода
  sast-php: # Идентификатор задания для PHP анализа
    name: SAST PHP (PHPStan & Psalm) # Отображаемое имя задания
    # Запуск на последнем Ubuntu
    runs-on: ubuntu-latest # Тип runner для выполнения задания
    defaults: # Настройки по умолчанию для задания
      run: # Конфигурация для команд run
        shell: bash # Использовать bash shell
    steps: # Секция шагов задания
      # Шаг 1: Получение кода репозитория
      - uses: actions/checkout@v4 # Действие для получения кода

      # Шаг 2: Настройка PHP среды
      - name: Setup PHP # Имя шага
        uses: shivammathur/setup-php@v2 # Действие для настройки PHP
        with: # Параметры действия
          php-version: '8.2' # Версия PHP для установки
          coverage: none # Отключить настройку покрытия кода
          tools: composer, phpstan, psalm # Инструменты для установки

      # Шаг 3: Установка PHP зависимостей в директории ui
      - name: Install UI PHP dependencies (if composer.json exists) # Имя шага
        working-directory: ui # Рабочая директория для команды
        run: | # Многострочная команда bash
          if [ -f composer.json ]; then # Проверка наличия composer.json
            composer install --no-interaction --no-progress --prefer-dist # Установка зависимостей
          else # Если composer.json не найден
            echo "ui/composer.json not found, skipping composer install" # Сообщение об отсутствии
          fi # Конец условия

      # Шаг 4: Создание конфигурации Psalm для CI
      - name: Create CI psalm config (avoid missing dirs like node_modules) # Имя шага
        working-directory: ui # Рабочая директория
        run: | # Многострочная команда bash
          cat > psalm-ci.xml <<'XML' # Создание файла конфигурации Psalm
          <?xml version="1.0"?> # XML декларация
          <psalm # Корневой элемент Psalm
            errorLevel="4" # Уровень ошибок (1-8, где 1 самый строгий)
            resolveFromConfigFile="true" # Разрешать пути относительно конфига
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" # XML namespace
            xsi:noNamespaceSchemaLocation="vendor/vimeo/psalm/config.xsd" # Ссылка на схему
          > # Открывающий тег
            <projectFiles> # Секция файлов проекта
              <directory name="."/> # Включать текущую директорию
              <ignoreFiles> # Секция игнорируемых файлов
                <directory name="vendor"/> # Игнорировать директорию vendor
              </ignoreFiles> # Конец секции игнорируемых файлов
            </projectFiles> # Конец секции файлов проекта
          </psalm> # Закрывающий тег
          XML # Конец heredoc

      # Шаг 5: Запуск PHPStan статического анализатора
      - name: Run PHPStan (Static Analysis) # Имя шага
        working-directory: ui # Рабочая директория
        run: | # Многострочная команда bash
          mkdir -p ../sast-out # Создание директории для результатов
          TARGETS="" # Инициализация переменной целей
          [ -d app ] && TARGETS="$TARGETS app" # Добавить app если существует
          [ -d classes ] && TARGETS="$TARGETS classes" # Добавить classes если существует
          [ -d include ] && TARGETS="$TARGETS include" # Добавить include если существует
          [ -z "$TARGETS" ] && TARGETS="." # Если цели пусты, использовать текущую директорию
          phpstan analyse $TARGETS --level=8 --no-progress --error-format=github \ # Запуск PHPStan
            > ../sast-out/phpstan-results.txt || true # Перенаправление вывода в файл

      # Шаг 6: Запуск Psalm анализатора
      - name: Run Psalm (Static/Security Analysis) # Имя шага
        working-directory: ui # Рабочая директория
        run: | # Многострочная команда bash
          mkdir -p ../sast-out # Создание директории для результатов
          psalm --config=psalm-ci.xml --stats --output-format=github \ # Запуск Psalm
            > ../sast-out/psalm-results.txt || true # Перенаправление вывода в файл

      # Шаг 7: Загрузка результатов PHP анализа как артефакта
      - name: Upload PHP results # Имя шага
        uses: actions/upload-artifact@v4 # Действие загрузки артефакта
        with: # Параметры действия
          name: sast-php-results # Имя артефакта
          path: | # Список путей для загрузки
            sast-out/phpstan-results.txt # Файл результатов PHPStan
            sast-out/psalm-results.txt # Файл результатов Psalm

  # Задание для анализа C/C++ кода
  sast-c: # Идентификатор задания для C/C++ анализа
    name: SAST C/C++ (Cppcheck) # Отображаемое имя задания
    runs-on: ubuntu-latest # Тип runner
    defaults: # Настройки по умолчанию
      run: # Конфигурация для команд run
        shell: bash # Использовать bash shell
    steps: # Секция шагов задания
      # Шаг 1: Получение кода репозитория
      - uses: actions/checkout@v4 # Действие для получения кода

      # Шаг 2: Установка Cppcheck
      - name: Install Cppcheck # Имя шага
        run: sudo apt-get update && sudo apt-get install -y cppcheck # Команда установки Cppcheck

      # Шаг 3: Запуск анализа Cppcheck
      - name: Run Cppcheck Analysis # Имя шага
        run: | # Многострочная команда bash
          mkdir -p sast-out # Создание директории для результатов
          cppcheck --enable=all --suppress=missingIncludeSystem \ # Запуск Cppcheck
                   --inline-suppr --error-exitcode=0 \ # Параметры Cppcheck
                   src/ 2> sast-out/cppcheck-results.txt || true # Перенаправление ошибок в файл

      # Шаг 4: Загрузка результатов C анализа как артефакта
      - name: Upload C results # Имя шага
        uses: actions/upload-artifact@v4 # Действие загрузки артефакта
        with: # Параметры действия
          name: sast-c-results # Имя артефакта
          path: sast-out/cppcheck-results.txt # Файл результатов Cppcheck

  # Задание для анализа Go кода
  sast-go: # Идентификатор задания для Go анализа
    name: SAST Go (Gosec) # Отображаемое имя задания
    runs-on: ubuntu-latest # Тип runner
    defaults: # Настройки по умолчанию
      run: # Конфигурация для команд run
        shell: bash # Использовать bash shell
    steps: # Секция шагов задания
      # Шаг 1: Получение кода репозитория
      - uses: actions/checkout@v4 # Действие для получения кода

      # Шаг 2: Настройка Go среды
      - name: Setup Go # Имя шага
        uses: actions/setup-go@v5 # Действие для настройки Go
        with: # Параметры действия
          go-version: '1.21' # Версия Go для установки

      # Шаг 3: Установка Gosec
      - name: Install Gosec # Имя шага
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest # Команда установки Gosec

      # Шаг 4: Запуск анализа Gosec для всех найденных Go модулей
      - name: Run Gosec Analysis # Имя шага
        run: | # Многострочная команда bash
          mkdir -p sast-out # Создание директории для результатов
          : > sast-out/gosec-results.txt # Создание пустого файла результатов
          while IFS= read -r dir; do # Цикл по всем директориям с go.mod
            echo "Analyzing Go module in $dir" | tee -a sast-out/gosec-results.txt # Лог начала анализа
            ( cd "$dir" && "$HOME/go/bin/gosec" ./... ) 2>&1 | tee -a sast-out/gosec-results.txt || true # Запуск Gosec
            echo "" >> sast-out/gosec-results.txt # Пустая строка для разделения
          done < <(find . -name "go.mod" -exec dirname {} \; | sort -u) # Поиск всех go.mod файлов

      # Шаг 5: Загрузка результатов Go анализа как артефакта
      - name: Upload Go results # Имя шага
        uses: actions/upload-artifact@v4 # Действие загрузки артефакта
        with: # Параметры действия
          name: sast-go-results # Имя артефакта
          path: sast-out/gosec-results.txt # Файл результатов Gosec

  # Задание для анализа JavaScript кода
  sast-js: # Идентификатор задания для JavaScript анализа
    name: SAST JavaScript (ESLint) # Отображаемое имя задания
    runs-on: ubuntu-latest # Тип runner
    defaults: # Настройки по умолчанию
      run: # Конфигурация для команд run
        shell: bash # Использовать bash shell
    steps: # Секция шагов задания
      # Шаг 1: Получение кода репозитория
      - uses: actions/checkout@v4 # Действие для получения кода

      # Шаг 2: Настройка Node.js среды
      - name: Setup Node.js # Имя шага
        uses: actions/setup-node@v4 # Действие для настройки Node.js
        with: # Параметры действия
          node-version: '18' # Версия Node.js для установки

      # Шаг 3: Установка ESLint и плагина безопасности
      - name: Install ESLint + security plugin # Имя шага
        run: | # Многострочная команда bash
          npm init -y # Инициализация package.json
          npm install eslint eslint-plugin-security --save-dev # Установка ESLint и плагина

      # Шаг 4: Создание минимальной конфигурации ESLint
      - name: Create minimal ESLint config # Имя шага
        run: | # Многострочная команда bash
          cat > .eslintrc.json <<'JSON' # Создание конфигурации ESLint
          { # Начало JSON объекта
            "plugins": ["security"], # Подключение плагина security
            "rules": { # Секция правил
              "security/detect-object-injection": "error", # Правило обнаружения инъекций
              "security/detect-eval-with-expression": "error", # Правило обнаружения eval
              "security/detect-non-literal-require": "error", # Правило обнаружения динамического require
              "security/detect-unsafe-regex": "error" # Правило обнаружения небезопасных regex
            } # Конец секции правил
          } # Конец JSON объекта
          JSON # Конец heredoc

      # Шаг 5: Запуск ESLint анализа безопасности
      - name: Run ESLint security analysis # Имя шага
        run: | # Многострочная команда bash
          mkdir -p sast-out # Создание директории для результатов
          npx eslint "ui/assets/js/**/*.js" --format=json > sast-out/eslint-results.json 2>/dev/null || true # Запуск ESLint

      # Шаг 6: Загрузка результатов JavaScript анализа как артефакта
      - name: Upload JavaScript results # Имя шага
        uses: actions/upload-artifact@v4 # Действие загрузки артефакта
        with: # Параметры действия
          name: sast-js-results # Имя артефакта
          path: sast-out/eslint-results.json # Файл результатов ESLint

  # Задание для генерации итогового отчета
  generate-report: # Идентификатор задания для генерации отчета
    name: Generate Summary Report # Отображаемое имя задания
    runs-on: ubuntu-latest # Тип runner
    # Зависит от выполнения всех SAST заданий
    needs: [sast-php, sast-c, sast-go, sast-js] # Зависимости от других заданий
    # Всегда запускается, даже если предыдущие задания упали
    if: always() # Условие выполнения (всегда)
    defaults: # Настройки по умолчанию
      run: # Конфигурация для команд run
        shell: bash # Использовать bash shell

    steps: # Секция шагов задания
      # Шаг 1: Скачивание всех артефактов с результатами
      - name: Download all SAST results # Имя шага
        uses: actions/download-artifact@v4 # Действие скачивания артефактов
        with: # Параметры действия
          path: artifacts # Директория для сохранения артефактов

      # Шаг 2: Создание HTML отчета с краткими результатами
      - name: Create HTML summary # Имя шага
        run: | # Многострочная команда bash (Bash shell script)
          OUT="sast-summary.html" # Имя выходного HTML файла
          echo "<html><body><h1>SAST Results Summary</h1>" > "$OUT" # Заголовок отчета
          echo "<p>Generated on $(date -u)</p>" >> "$OUT" # Дата генерации

          echo "<h2>PHP Analysis</h2>" >> "$OUT" # Заголовок секции PHP
          if [ -f "artifacts/sast-php-results/phpstan-results.txt" ]; then # Проверка наличия PHPStan результатов
            echo "<h3>PHPStan (last 50 lines)</h3><pre>" >> "$OUT" # Подзаголовок PHPStan
            tail -50 "artifacts/sast-php-results/phpstan-results.txt" >> "$OUT" # Последние 50 строк результатов
            echo "</pre>" >> "$OUT" # Закрытие тега pre
          else # Если файл не найден
            echo "<p>PHPStan results not found</p>" >> "$OUT" # Сообщение об отсутствии
          fi # Конец условия

          if [ -f "artifacts/sast-php-results/psalm-results.txt" ]; then # Проверка наличия Psalm результатов
            echo "<h3>Psalm (last 50 lines)</h3><pre>" >> "$OUT" # Подзаголовок Psalm
            tail -50 "artifacts/sast-php-results/psalm-results.txt" >> "$OUT" # Последние 50 строк результатов
            echo "</pre>" >> "$OUT" # Закрытие тега pre
          else # Если файл не найден
            echo "<p>Psalm results not found</p>" >> "$OUT" # Сообщение об отсутствии
          fi # Конец условия

          echo "<h2>C/C++ Analysis</h2>" >> "$OUT" # Заголовок секции C/C++
          if [ -f "artifacts/sast-c-results/cppcheck-results.txt" ]; then # Проверка наличия Cppcheck результатов
            echo "<h3>Cppcheck (first 30 warnings/errors)</h3><pre>" >> "$OUT" # Подзаголовок Cppcheck
            grep -E "(error|warning)" "artifacts/sast-c-results/cppcheck-results.txt" | head -30 >> "$OUT" || true # Первые 30 ошибок/предупреждений
            echo "</pre>" >> "$OUT" # Закрытие тега pre
          else # Если файл не найден
            echo "<p>Cppcheck results not found</p>" >> "$OUT" # Сообщение об отсутствии
          fi # Конец условия

          echo "<h2>Go Analysis</h2>" >> "$OUT" # Заголовок секции Go
          if [ -f "artifacts/sast-go-results/gosec-results.txt" ]; then # Проверка наличия Gosec результатов
            echo "<h3>Gosec (last 80 lines)</h3><pre>" >> "$OUT" # Подзаголовок Gosec
            tail -80 "artifacts/sast-go-results/gosec-results.txt" >> "$OUT" # Последние 80 строк результатов
            echo "</pre>" >> "$OUT" # Закрытие тега pre
          else # Если файл не найден
            echo "<p>Gosec results not found</p>" >> "$OUT" # Сообщение об отсутствии
          fi # Конец условия

          echo "<h2>JavaScript Analysis</h2>" >> "$OUT" # Заголовок секции JavaScript
          if [ -f "artifacts/sast-js-results/eslint-results.json" ]; then # Проверка наличия ESLint результатов
            echo "<p>ESLint JSON saved as artifact (see artifacts).</p>" >> "$OUT" # Информация о JSON файле
          else # Если файл не найден
            echo "<p>ESLint results not found</p>" >> "$OUT" # Сообщение об отсутствии
          fi # Конец условия

          echo "</body></html>" >> "$OUT" # Закрытие тегов HTML

      # Шаг 3: Загрузка финального отчета и всех артефактов
      - name: Upload final report + all artifacts bundle # Имя шага
        uses: actions/upload-artifact@v4 # Действие загрузки артефакта
        with: # Параметры действия
          name: sast-final-report # Имя артефакта
          path: | # Список путей для загрузки
            sast-summary.html # HTML отчет
            artifacts/ # Директория со всеми артефактами
